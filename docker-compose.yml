  # version: '3.8'

services:
  # MySQL 数据库服务
  mysql:
    image: mysql:8.0                     # 使用 MySQL 8.0 官方镜像
    container_name: second-hand-mysql    # 固定容器名称，方便管理
    restart: always                      # 容器退出时自动重启
    environment: # 环境变量（传给 MySQL 容器）
      MYSQL_ROOT_PASSWORD: 1459929060    # root 用户的密码
      MYSQL_DATABASE: es                 # 容器启动时自动创建的数据库名
    ports:
      - "3307:3306"                      # 宿主机 3307 端口 → 容器内 3306 端口
    volumes:
      - mysql_data:/var/lib/mysql        # 数据卷：持久化 MySQL 数据，防止容器删除后数据丢失
      - ./ES-springboot/es.sql:/docker-entrypoint-initdb.d/init.sql  # 启动时自动执行该 SQL 文件初始化数据库
    networks:
      - second-hand-network              # 加入自定义网络，与其他服务互通
    healthcheck: # 健康检查（确保 MySQL 完全启动后再启动后端）
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 10s                      # 每 10 秒检查一次
      timeout: 5s                        # 每次检查超时 5 秒
      retries: 5                         # 连续失败 5 次才认为不健康


  # 后端服务
  backend:
    build:                               # 构建镜像（不使用现成镜像，从 Dockerfile 构建）
      context: ./ES-springboot           # 构建上下文路径（Dockerfile 所在目录）
      dockerfile: Dockerfile             # Dockerfile 文件名
    container_name: second-hand-backend  # 固定容器名称
    restart: always                      # 自动重启
    ports:
      - "8080:8080"                      # 宿主机 8080 端口 → 容器内 8080 端口
    environment:                         # 传给 Spring Boot 的环境变量（会覆盖 application.properties）
      # Docker 中数据库地址用服务名 mysql（不是 localhost）
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/es?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: 1459929060
      UPLOAD_PATH: /app/uploads/          # ← Docker 中使用容器内的路径---文件上传保存的路径
      # Redis主机地址
      REDIS_HOST: redis          # 使用服务名访问（同一网络内）
      REDIS_PORT: 6379           # Redis 默认端口
      REDIS_PASSWORD: ""         # Redis 无密码（生产环境建议设置）
    volumes:
        - ./ES-springboot/uploads:/app/uploads   # ← 挂载本地的 uploads 到容器
    depends_on:                          # 依赖关系：等待 mysql 服务健康后再启动后端
      mysql:
        condition: service_healthy       # 必须等待 MySQL 健康检查通过
      redis:
        condition: service_healthy       # 必须等待 Redis 健康检查通过
    networks:
      - second-hand-network             # 加入同一网络

  # 前端服务
  frontend:
    build: # 构建前端镜像
      context: ./es-vue                  # 前端项目目录（包含 Dockerfile）
      dockerfile: Dockerfile
    container_name: second-hand-frontend # 固定容器名称
    restart: always
    ports:
      - "80:80"                          # 宿主机 80 端口 → 容器内 80 端口（直接通过 IP 访问，无需加端口号）
    depends_on:
      - backend                          # 依赖后端（但只是启动顺序，Nginx 会自己处理后端不可用情况）
    networks:
      - second-hand-network

    # ========== 预留：Redis（以后需要时取消注释） ==========
  redis:
     # 指定使用的 Docker 镜像：Redis 7 版本，基于轻量级的 Alpine Linux
     image: redis:7-alpine

     # 指定容器的固定名称（在 docker ps 中显示为 second-hand-redis）
     container_name: second-hand-redis

     # 重启策略：容器意外停止时自动重启（保证高可用）
     restart: always

     # 端口映射：将宿主机的 6379 端口映射到容器的 6379 端口
     # 这样本机程序（或外部工具）可以通过 localhost:6379 访问 Redis
     ports:
       - "6379:6379"

     # 健康检查配置：确保 Redis 容器正常运行
     healthcheck:
       test: [ "CMD", "redis-cli", "ping" ]    # 使用 redis-cli ping 检查
       interval: 10s                          # 每10秒检查一次
       timeout: 5s                           # 超时5秒
       retries: 5                           # 失败5次视为不健康


     # 网络配置：将此容器加入自定义网络 second-hand-network
     # 加入同一网络的其他容器可以通过服务名 "redis" 来访问它
     networks:
       - second-hand-network

# 数据卷（持久化存储）
volumes:
  mysql_data:        # 定义名为 mysql_data 的数据卷，用于存放 MySQL 实际数据文件

# 网络（容器间通信）
networks:
  second-hand-network:
    driver: bridge      # 桥接网络，让容器之间可以通过服务名互相访问

