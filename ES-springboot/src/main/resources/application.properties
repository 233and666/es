#===   这里用于docker容器    ======
# ========== 数据库配置 ==========
# 使用环境变量，Docker 中会自动传入
# 本地开发时用默认值（localhost），Docker 中用 mysql（服务名）
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/es?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:1459929060}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# 静态资源路径 - Docker 中使用 /app/uploads，本地使用 ./uploads
# 本地开发默认值: D:/java开发路线学习/ES/ES-springboot/uploads/
# Docker 中会被环境变量 UPLOAD_PATH=/app/uploads/  覆盖
spring.web.resources.static-locations=classpath:/static/,file:${UPLOAD_PATH:D:/java开发路线学习/ES/ES-springboot/uploads/}
spring.web.resources.chain.enabled=true


















